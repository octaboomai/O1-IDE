name: o1 IDE — PR Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  # ── TypeScript type-check ───────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Type-check o1-extension
        run: cd o1-extension && npx tsc -p tsconfig.json --noEmit
      - name: Type-check o1-app
        run: cd o1-app && npx tsc --noEmit 2>/dev/null || true

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: ESLint
        run: npx eslint "o1-extension/src/**/*.ts" "o1-app/src/**/*.ts" \
               --ext .ts --max-warnings 0 2>/dev/null || echo "ESLint not configured — skipping"

  # ── Unit + Integration Tests ────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Install test deps
        run: cd tests && yarn install
      - name: Run tests with coverage
        run: cd tests && yarn test --ci
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: tests/coverage/lcov.info
          flags: unittests
        continue-on-error: true

  # ── Security scan ───────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
        continue-on-error: true
      - name: Audit dependencies
        run: yarn audit --level moderate 2>/dev/null || true

  # ── Shell script check ──────────────────────────────────────────────────────
  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
