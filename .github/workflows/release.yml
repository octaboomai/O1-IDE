name: o1 IDE — Release Build

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  # ── Linux (.deb + .AppImage) ────────────────────────────────────────────────
  build-linux:
    name: Linux build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbfile-dev \
            libsecret-1-dev rpm fakeroot dpkg imagemagick

      - run: yarn install --frozen-lockfile


      - name: Bundle clangd (Linux x64)
        run: |
          mkdir -p resources/clangd
          curl -fsSL "https://github.com/clangd/clangd/releases/download/18.1.3/clangd-linux-18.1.3.zip" \
            -o /tmp/clangd.zip
          unzip -q /tmp/clangd.zip -d /tmp/clangd-bin
          cp /tmp/clangd-bin/clangd_18.1.3/bin/clangd resources/clangd/
          chmod +x resources/clangd/clangd

      - name: Bundle pyright (offline npm package)
        run: |
          mkdir -p resources/pyright
          cd resources/pyright && npm init -y && npm install pyright --no-save
          echo '{"name":"pyright-bundle","version":"1.0.0"}' > package.json

      - name: Bundle vendor JS (offline Three.js + roslibjs)
        run: |
          mkdir -p resources/vendor
          curl -fsSL "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" \
            -o resources/vendor/three.min.js
          curl -fsSL "https://cdnjs.cloudflare.com/ajax/libs/roslibjs/1.3.0/roslib.min.js" \
            -o resources/vendor/roslib.min.js

      - name: Build Theia (production)
        run: yarn workspace o1-extension build && yarn workspace o1-app build:prod

      - name: Download IDE plugins (language grammars)
        shell: bash   # Windows runners default to PowerShell; this step is bash
        run: |
          # Fetch the .vsix files directly. `theia download:plugins` hits Open VSX
          # and fails intermittently from CI runners; this is deterministic.
          mkdir -p o1-app/plugins
          fetch_plugin () {
            id="$1"; url="$2"
            dest="o1-app/plugins/$id"
            rm -rf "$dest" /tmp/p.vsix /tmp/px
            mkdir -p "$dest"
            curl -fsSL --retry 5 --retry-delay 3 "$url" -o /tmp/p.vsix
            unzip -q -o /tmp/p.vsix -d /tmp/px
            cp -r /tmp/px/extension/. "$dest"/
            test -f "$dest/package.json" || { echo "::error::$id has no package.json"; exit 1; }
            echo "  bundled $id"
          }
          fetch_plugin magicstack.MagicPython-1.1.1 "https://open-vsx.org/api/magicstack/MagicPython/1.1.1/file/magicstack.MagicPython-1.1.1.vsix"
          fetch_plugin jeff-hykin.better-cpp-syntax-1.27.1 "https://open-vsx.org/api/jeff-hykin/better-cpp-syntax/1.27.1/file/jeff-hykin.better-cpp-syntax-1.27.1.vsix"
          fetch_plugin twxs.cmake-0.0.17 "https://open-vsx.org/api/twxs/cmake/0.0.17/file/twxs.cmake-0.0.17.vsix"
          fetch_plugin DotJoshJohnson.xml-2.5.1 "https://open-vsx.org/api/DotJoshJohnson/xml/2.5.1/file/DotJoshJohnson.xml-2.5.1.vsix"
          # C++ grammar ships WITHOUT a language declaration, so .cpp never maps to it.
          # Add a tiny plugin that declares the language and reuses the MIT grammar.
          LP="o1-app/plugins/octaboomai.o1-languages-0.1.0"
          mkdir -p "$LP/syntaxes"
          cp o1-app/plugins/jeff-hykin.better-cpp-syntax-1.27.1/autogenerated/cpp.tmLanguage.json \
             "$LP/syntaxes/cpp.tmLanguage.json"
          cat > "$LP/package.json" <<'JSON'
          {
            "name": "o1-languages",
            "publisher": "octaboomai",
            "version": "0.1.0",
            "description": "Language ids for o1 IDE",
            "engines": { "vscode": "*" },
            "contributes": {
              "languages": [
                { "id": "cpp", "aliases": ["C++", "C"],
                  "extensions": [".cpp", ".cc", ".cxx", ".c++", ".hpp", ".hh", ".hxx", ".h", ".c", ".ino"] }
              ],
              "grammars": [
                { "language": "cpp", "scopeName": "source.cpp", "path": "./syntaxes/cpp.tmLanguage.json" }
              ]
            }
          }
          JSON
          echo "  bundled octaboomai.o1-languages-0.1.0 (cpp)"
          echo "--- plugins ---"
          ls -1 o1-app/plugins

      - name: Package .deb + .AppImage
        run: npx electron-builder --linux deb AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist/*.deb
            dist/*.AppImage

  # ── Windows (.exe + .msi) ───────────────────────────────────────────────────
  build-windows:
    name: Windows build
    runs-on: windows-2022
    needs: build-linux
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --frozen-lockfile


      - name: Bundle clangd (Windows x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/clangd
          $url = "https://github.com/clangd/clangd/releases/download/18.1.3/clangd-windows-18.1.3.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP/clangd-win.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP/clangd-win.zip" -DestinationPath "$env:TEMP/clangd-win"
          Copy-Item "$env:TEMP/clangd-win/clangd_18.1.3/bin/clangd.exe" resources/clangd/

      - name: Bundle pyright
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/pyright
          cd resources/pyright
          npm init -y
          npm install pyright --no-save
          '{"name":"pyright-bundle","version":"1.0.0"}' | Out-File package.json

      - name: Bundle vendor JS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/vendor
          Invoke-WebRequest "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" -OutFile resources/vendor/three.min.js -UseBasicParsing
          Invoke-WebRequest "https://cdnjs.cloudflare.com/ajax/libs/roslibjs/1.3.0/roslib.min.js" -OutFile resources/vendor/roslib.min.js -UseBasicParsing

      - name: Build Theia (production)
        run: yarn workspace o1-extension build && yarn workspace o1-app build:prod

      - name: Download IDE plugins (language grammars)
        shell: bash   # Windows runners default to PowerShell; this step is bash
        run: |
          # Fetch the .vsix files directly. `theia download:plugins` hits Open VSX
          # and fails intermittently from CI runners; this is deterministic.
          mkdir -p o1-app/plugins
          fetch_plugin () {
            id="$1"; url="$2"
            dest="o1-app/plugins/$id"
            rm -rf "$dest" /tmp/p.vsix /tmp/px
            mkdir -p "$dest"
            curl -fsSL --retry 5 --retry-delay 3 "$url" -o /tmp/p.vsix
            unzip -q -o /tmp/p.vsix -d /tmp/px
            cp -r /tmp/px/extension/. "$dest"/
            test -f "$dest/package.json" || { echo "::error::$id has no package.json"; exit 1; }
            echo "  bundled $id"
          }
          fetch_plugin magicstack.MagicPython-1.1.1 "https://open-vsx.org/api/magicstack/MagicPython/1.1.1/file/magicstack.MagicPython-1.1.1.vsix"
          fetch_plugin jeff-hykin.better-cpp-syntax-1.27.1 "https://open-vsx.org/api/jeff-hykin/better-cpp-syntax/1.27.1/file/jeff-hykin.better-cpp-syntax-1.27.1.vsix"
          fetch_plugin twxs.cmake-0.0.17 "https://open-vsx.org/api/twxs/cmake/0.0.17/file/twxs.cmake-0.0.17.vsix"
          fetch_plugin DotJoshJohnson.xml-2.5.1 "https://open-vsx.org/api/DotJoshJohnson/xml/2.5.1/file/DotJoshJohnson.xml-2.5.1.vsix"
          echo "--- plugins ---"
          ls -1 o1-app/plugins

      - name: Package .exe
        timeout-minutes: 20
        shell: pwsh
        run: |
          Write-Host "cwd: $(Get-Location)"
          Write-Host "electron-builder cli present: $(Test-Path node_modules/electron-builder/cli.js)"
          node node_modules/electron-builder/cli.js --win nsis --publish never
        env:
          DEBUG: electron-builder

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist/*.exe

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: dist/

      - name: Verify build outputs are present
        run: |
          echo "--- downloaded artifacts ---"
          find dist -maxdepth 2 -type f | sort
          missing=0
          for f in dist/linux-builds/*.deb dist/linux-builds/*.AppImage dist/windows-builds/*.exe; do
            if [ ! -f "$f" ]; then echo "::error::missing build output: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Prepare release notes
        run: |
          if [ ! -f CHANGELOG.md ]; then
            VERSION=${GITHUB_REF_NAME#v}
            echo "## o1 IDE ${VERSION}" > release-notes.md
            echo "" >> release-notes.md
            echo "### Downloads" >> release-notes.md
            echo "| Platform | Format | Notes |" >> release-notes.md
            echo "|---|---|---|" >> release-notes.md
            echo "| Ubuntu / Debian | \`.deb\` | \`sudo apt install ./o1-ide-*.deb\` |" >> release-notes.md
            echo "| Any Linux | \`.AppImage\` | \`chmod +x o1-ide-*.AppImage && ./o1-ide-*.AppImage\` |" >> release-notes.md
            echo "| Windows 10/11 | \`.exe\` | Run installer, follow prompts |" >> release-notes.md
          else
            cp CHANGELOG.md release-notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: "o1 IDE ${{ github.ref_name }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          fail_on_unmatched_files: true
          files: |
            dist/linux-builds/*.deb
            dist/linux-builds/*.AppImage
            dist/windows-builds/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
